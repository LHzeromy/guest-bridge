name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run tests
        run: go test -race ./...
      - name: Build release artifacts
        run: |
          mkdir -p release
          AGENT_LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.repoURL=https://github.com/${GITHUB_REPOSITORY}"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/guest-relay-linux-amd64 ./cmd/guest-relay
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/guestctl-linux-amd64 ./cmd/guestctl
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="${AGENT_LDFLAGS}" -o release/guest-agent-linux-amd64 ./cmd/guest-agent
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="${AGENT_LDFLAGS}" -o release/guest-agent-linux-arm64 ./cmd/guest-agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${AGENT_LDFLAGS}" -o release/guest-agent-windows-amd64.exe ./cmd/guest-agent
          cp LICENSE release/LICENSE
          cp "$(go env GOROOT)/LICENSE" release/GO_STDLIB_LICENSE
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
